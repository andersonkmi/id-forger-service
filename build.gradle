buildscript {
	repositories {
		mavenCentral()
	}
}

plugins {
	id ("org.springframework.boot") version "4.1.2"
	id ("io.spring.dependency-management") version "1.1.7"
	id ("java")
	id ("jacoco")
}

group = 'org.codecraftlabs'
version = '1.2.0'

repositories {
	mavenLocal()
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

dependencies {
	// Spring related dependencies
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
	runtimeOnly 'org.postgresql:postgresql:42.7.14'

	// Test related dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test // tests are required to run before generating the report
}

bootJar {
	mainClass = 'org.codecraftlabs.idgenerator.MainApplication'
	archiveBaseName = 'id-forger-service'
	manifest {
		attributes('Implementation-Title': 'ID Forger Service', 'Implementation-Version': version)
	}
}

bootRun {
	systemProperty 'spring.profiles.active', findProperty('profile') ?: 'local'
}

tasks.register('deleteLogs', Delete) {
	delete fileTree("${projectDir}/logs")
}

tasks.named("clean") {
	dependsOn tasks.named("deleteLogs")
}

sourceSets {
    integrationTest {
        java {
            srcDir 'src/integrationTest/java'
        }
        resources {
            srcDir 'src/integrationTest/resources'
        }
        compileClasspath += main.output + test.output
        runtimeClasspath += main.output + test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    integrationTestImplementation 'org.junit.jupiter:junit-jupiter'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
}

// Self-contained: boots the app on a random port against a Postgres Testcontainer (requires Docker)
tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    useJUnitPlatform {
        includeTags 'integration'
    }
}

// Load test against an already running instance (e.g. docker compose up), defaults to http://localhost:27110
tasks.register('loadTest', Test) {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    systemProperty 'loadTest.baseUrl', findProperty('loadTest.baseUrl') ?: 'http://localhost:27110'
    systemProperty 'loadTest.totalCalls', findProperty('loadTest.totalCalls') ?: '100000'
    testLogging.showStandardStreams = true

    useJUnitPlatform {
        includeTags 'load'
    }
}