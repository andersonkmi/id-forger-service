import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
	id ("org.springframework.boot") version "4.1.2" apply false
	id ("io.spring.dependency-management") version "1.1.7" apply false
}

// Conventions shared by every module
subprojects {
	apply plugin: 'java'
	apply plugin: 'jacoco'
	apply plugin: 'io.spring.dependency-management'

	group = 'org.codecraftlabs'
	version = '1.2.0'

	repositories {
		mavenLocal()
		mavenCentral()
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	dependencyManagement {
		imports {
			mavenBom SpringBootPlugin.BOM_COORDINATES
		}
	}

	dependencies {
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testImplementation 'org.junit.jupiter:junit-jupiter'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	test {
		useJUnitPlatform()
		finalizedBy jacocoTestReport
	}

	jacocoTestReport {
		dependsOn test // tests are required to run before generating the report
	}
}

// Conventions shared by the runnable Spring Boot services
configure([project(':id-forger-api'), project(':id-forger-admin')]) {
	apply plugin: 'org.springframework.boot'

	dependencies {
		implementation project(':id-forger-common')
		testImplementation testFixtures(project(':id-forger-common'))
	}

	bootRun {
		systemProperty 'spring.profiles.active', findProperty('profile') ?: 'local'
	}

	tasks.register('deleteLogs', Delete) {
		delete fileTree("${projectDir}/logs")
	}

	tasks.named("clean") {
		dependsOn tasks.named("deleteLogs")
	}

	sourceSets {
		integrationTest {
			java {
				srcDir 'src/integrationTest/java'
			}
			resources {
				srcDir 'src/integrationTest/resources'
			}
			compileClasspath += main.output + test.output
			runtimeClasspath += main.output + test.output
		}
	}

	configurations {
		integrationTestImplementation.extendsFrom testImplementation
		integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
	}

	dependencies {
		integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
		integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
		integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
		integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
	}

	// Self-contained: boots the service on a random port against a Postgres Testcontainer (requires Docker).
	// The container is seeded with the shared schema in docker/pgsql/init.sql.
	tasks.register('integrationTest', Test) {
		description = 'Runs the integration tests against a Postgres Testcontainer.'
		group = 'verification'
		testClassesDirs = sourceSets.integrationTest.output.classesDirs
		classpath = sourceSets.integrationTest.runtimeClasspath
		systemProperty 'integrationTest.initSql', rootProject.file('docker/pgsql/init.sql').absolutePath

		useJUnitPlatform {
			includeTags 'integration'
		}
	}

	// Load test against an already running instance (e.g. docker compose up).
	// Each module sets its own default base URL and number of calls.
	tasks.register('loadTest', Test) {
		description = 'Runs the load test against an already running instance of the service.'
		group = 'verification'
		testClassesDirs = sourceSets.integrationTest.output.classesDirs
		classpath = sourceSets.integrationTest.runtimeClasspath
		testLogging.showStandardStreams = true

		useJUnitPlatform {
			includeTags 'load'
		}
	}
}
