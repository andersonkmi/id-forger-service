services:
  postgres:
    image: codecraftlabs/idgeneratordb:1.0.0
    build:
      context: ./pgsql
    container_name: id-generator-db
    environment:
      POSTGRES_DB: idgenerator
      POSTGRES_USER: idgen
      POSTGRES_PASSWORD: idgen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ID generation hot path (GET /idgenerator/v1/ids/{seriesName})
  id-forger-api:
    image: codecraftlabs/id-forger-api:1.2.0
    build:
      context: ../id-forger-api
    container_name: id-forger-api
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: idgenerator
      DB_USER: idgen
      DB_PASSWORD: idgen
    ports:
      - "27110:27110"

  # Series management (/idgenerator/v1/series/**). Has no authentication yet:
  # keep this port off public networks.
  id-forger-admin:
    image: codecraftlabs/id-forger-admin:1.2.0
    build:
      context: ../id-forger-admin
    container_name: id-forger-admin
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: idgenerator
      DB_USER: idgen
      DB_PASSWORD: idgen
    ports:
      - "27111:27111"

volumes:
  postgres_data:
