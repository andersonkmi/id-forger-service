description = 'ID Forger Admin: series management endpoints'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
	runtimeOnly 'org.postgresql:postgresql:42.7.14'
}

bootJar {
	mainClass = 'org.codecraftlabs.idgenerator.admin.IdForgerAdminApplication'
	archiveBaseName = 'id-forger-admin'
	manifest {
		attributes('Implementation-Title': 'ID Forger Admin', 'Implementation-Version': version)
	}
}

tasks.named('loadTest') {
	systemProperty 'loadTest.baseUrl', findProperty('loadTest.baseUrl') ?: 'http://localhost:27111'
	systemProperty 'loadTest.totalCalls', findProperty('loadTest.totalCalls') ?: '2000'
}
